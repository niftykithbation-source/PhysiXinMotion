workflows:
  ios-workflow:
    name: PhysiX in Motion — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.physixinmotion.physixInMotion"   # matches ios/Runner.xcodeproj's PRODUCT_BUNDLE_IDENTIFIER
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      # Unsigned build for AltStore/SideStore sideload distribution — no
      # Apple Developer account, App Store Connect API key, or TestFlight
      # involved anywhere in this pipeline. AltStore/SideStore re-sign the
      # .app locally on each user's own device with THEIR OWN free Apple
      # ID at install time; this build only needs to produce the unsigned
      # .app bundle for that to work.
      - name: Build unsigned .app (no Apple signing)
        script: |
          flutter build ios --release --no-codesign
      - name: Zip Runner.app for sideload distribution
        script: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app
    artifacts:
      - build/ios/iphoneos/Runner.app.zip
    publishing:
      email:
        recipients:
          - niftykith@gmail.com   # update if you'd rather notifications go elsewhere
        notify:
          success: true
          failure: true

  android-workflow:
    name: PhysiX in Motion — Android
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - android_signing            # create this group in Codemagic UI: keystore + credentials
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
